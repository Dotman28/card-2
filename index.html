<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Birthday Pass | Barrister Esther Otsabomhe</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #fdf6f0, #ffe5ec, #e0f7fa);
      background-size: 400% 400%;
      animation: backgroundMove 10s ease infinite;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2em;
    }

    @keyframes backgroundMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: #ffffffcc;
      padding: 2em;
      border-radius: 16px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      text-align: center;
    }

    h1 {
      color: #d6336c;
      font-size: 2.5em;
      margin-bottom: 0.5em;
    }

    .details {
      font-size: 1.1em;
      line-height: 1.6em;
      margin-bottom: 2em;
    }

    .qr img {
      width: 200px;
      height: 200px;
      border: 4px solid #d6336c;
      border-radius: 12px;
    }

    .qr p {
      margin-top: 0.5em;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎉 You're Invited!</h1>
    <p class="details" id="invite-text">
      Loading invitation...
    </p>

    <div class="qr">
      <img id="qr-code" src="" alt="QR Code Invitation"/>
      <p>📱 Scan this code at the entrance</p>
    </div>
  </div>

  <script>
    // Get URL parameter
    const params = new URLSearchParams(window.location.search);
    const guestName = params.get("name") || "Guest";

    // Format message
    const inviteText = `
      Dear <strong>${guestName}</strong>,<br/>
      You are warmly invited to celebrate the birthday of<br/>
      <strong>Barrister Esther Otsabomhe</strong><br/>
      📍 <strong>Lagos Continental Hotel</strong><br/>
      🏢 52a Kofo Abayomi St, Victoria Island, Lagos<br/>
      🕒 <strong>3:00 PM</strong><br/>
      🗓️ <strong>May 4, 2025</strong>
    `;

    // Inject into the page
    document.getElementById("invite-text").innerHTML = inviteText;

    // Create QR message
    const qrMessage = `Name: ${guestName}\nYou are invited to Barrister Esther Otsabomhe's Birthday Party at Lagos Continental Hotel, 52a Kofo Abayomi St, Victoria Island, Lagos at 3PM on May 4, 2025. Welcome!`;

    // Encode and set QR code image
    const qrUrl = "https://chart.googleapis.com/chart?chs=200x200&cht=qr&chl=" + encodeURIComponent(qrMessage);
    document.getElementById("qr-code").src = qrUrl;
  </script>
</body>
</html>
